<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Test - Logo with Arrow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="logo-container" dir="ltr">
        <div class="icon-wrapper">
            <div class="logo-icon">
                <span class="bar red"></span>
                <span class="bar orange"></span>
                <span class="bar green-bar"></span>
            </div>
            <span class="arrow-up"></span>
        </div>
        
        <div class="logo-text">
            <span class="check-word">
                <span class="char">C</span><span class="char">h</span><span class="char">e</span><span class="char">c</span><span class="char">k</span>
            </span>
            <span class="test-word">
                <span class="char">T</span><span class="char">e</span><span class="char">s</span><span class="char">t</span>
            </span>
        </div>
    </div>

</body>
</html>
